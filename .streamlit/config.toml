[theme]
base = "light"
primaryColor = "#f97316"
backgroundColor = "#f4f4f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#27272a"
font = "sans serif"

[client]
toolbarMode = "viewer"   # без кнопки Deploy и меню разработчика

[server]
headless = true          # первый запуск не спрашивает email в терминале
