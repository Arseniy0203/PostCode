[theme]
base = "light"
primaryColor = "#294DA6"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#ffffff"
textColor = "#1E293B"
font = "sans serif"

[client]
toolbarMode = "viewer"   # без кнопки Deploy и меню разработчика

[server]
headless = true          # первый запуск не спрашивает email в терминале
